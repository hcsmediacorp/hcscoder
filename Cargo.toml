[package]
name = "hcscoder"
version = "1.0.0"
edition = "2021"
authors = ["hcsmedia (Tim) <hcsmediagroup@gmail.com>"]
description = "High-performance AI coding assistant by hcsmedia - Privacy-first, OpenRouter-powered"
license = "MIT"
repository = "https://github.com/hcsmedia/hcscoder"
keywords = ["cli", "ai", "coding", "openrouter", "privacy"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# CLI Parsing
clap = { version = "4.4", features = ["derive", "env"] }

# HTTP Client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Stream Support
async-stream = "0.3"
futures-util = "0.3"

# Terminal UI
ratatui = "0.24"
crossterm = "0.27"
indicatif = "0.17"
atty = "0.2"

# Cryptography & Security
ring = "0.17"
base64 = "0.21"

# File System & Watching
notify = "6.1"
tokio-stream = "0.1"

# Logging (local only, no remote)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Secure stdin (API key prompt)
rpassword = "7"

# Random Number Generation (for Buddy Gacha)
rand = "0.8"
rand_chacha = "0.3"

# Time Handling
chrono = { version = "0.4", features = ["serde"] }

# UUID Generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Directory Management
dirs = "5.0"
shellexpand = "3.1"

# Process Execution (tokio::process in code)
regex = "1.10"
sysinfo = "0.30"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "hcscoder"
path = "src/main.rs"

[[bin]]
name = "hcscoder-setup"
path = "src/bin/hcscoder-setup.rs"
