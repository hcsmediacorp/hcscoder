name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            target/release/hcscoder.exe
            target/release/hcscoder-setup.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Install OpenSSL (native-tls)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build --release
        run: cargo build --release

      - name: Strip binaries
        run: strip target/release/hcscoder target/release/hcscoder-setup || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            target/release/hcscoder
            target/release/hcscoder-setup
          if-no-files-found: error

  github-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts/linux

      - name: Package archives
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          cp install.ps1 install.sh artifacts/windows/
          cp install.sh artifacts/linux/
          (cd artifacts/windows && zip -r "../../dist/hcscoder-${VERSION}-windows-x86_64.zip" hcscoder.exe hcscoder-setup.exe install.ps1)
          (cd artifacts/linux && tar czvf "../../dist/hcscoder-${VERSION}-linux-x86_64.tar.gz" hcscoder hcscoder-setup install.sh)
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: hcscoder ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
